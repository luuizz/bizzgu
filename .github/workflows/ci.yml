# Validação de toda mudança antes de entrar na dev ou na main.
# Roda em PRs (feature → dev e dev → main) e em pushes na dev.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A main só recebe código vindo da dev (esteira dev → main)
  origem:
    name: Origem do PR
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: PR para a main precisa vir da dev
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::PRs para a main devem sair da branch dev (recebido: $HEAD_REF). Abra o PR para a dev primeiro."
            exit 1
          fi
          echo "Origem ok: dev → main"

  front:
    name: Lint e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - name: Build
        run: yarn build
        env:
          # Endereços fictícios: só para o build gerar a loja completa
          VITE_NEON_AUTH_URL: https://ci.example.com/neondb/auth
          VITE_NEON_DATA_API_URL: https://ci.example.com/neondb/rest/v1

  database:
    name: Migrations (Postgres de teste)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Simula o Neon Auth + Data API
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/ci/neon-stub.sql
      - name: Aplica as migrations do zero
        run: yarn db:migrate
      - name: Segunda execução não aplica nada
        run: yarn db:migrate | tee out.txt && grep -q "Banco em dia" out.txt
