# Produção: tudo que entra na main (via PR da dev) é publicado na Vercel.
# 1. aplica as migrations pendentes no banco do Neon
# 2. gera o build com os endereços do Neon
# 3. publica na Vercel (só depois que o banco estiver em dia)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Banco (migrations)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Confere a connection string
        id: check
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Secret NEON_DATABASE_URL não configurado: migrations não foram aplicadas. Veja o README (Deploy)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.check.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: yarn
      - if: steps.check.outputs.skip != 'true'
        run: yarn install --frozen-lockfile
      - if: steps.check.outputs.skip != 'true'
        run: yarn db:migrate

  deploy:
    name: Publicar na Vercel
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.publish.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_NEON_AUTH_URL: ${{ vars.VITE_NEON_AUTH_URL }}
      VITE_NEON_DATA_API_URL: ${{ vars.VITE_NEON_DATA_API_URL }}
      VITE_UPLOAD_FUNCTION_URL: ${{ vars.VITE_UPLOAD_FUNCTION_URL }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
    steps:
      - name: Confere a configuração
        run: |
          missing=""
          for name in VITE_NEON_AUTH_URL VITE_NEON_DATA_API_URL VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltam no GitHub (Settings → Secrets and variables → Actions):$missing. Veja o README (Deploy)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Instala a Vercel CLI
        run: npm install --global vercel@65
      - name: Baixa a configuração do projeto
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Publica
        id: publish
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Publicado: $url" >> "$GITHUB_STEP_SUMMARY"
